name = "witnessgrid-api"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Non-sensitive settings only. Secrets live outside this file — set them with
# `wrangler secret put <NAME>` (or .dev.vars locally):
#   JWT_SECRET        session signing secret (>= 32 chars, openssl rand -hex 32)
#   DATABASE_URL      Postgres connection string (Neon, Supabase, ...)
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / R2_BUCKET
#                     only needed when OBJECT_STORE = "r2"
#   RESEND_API_KEY    email delivery
[vars]
PUBLIC_ORIGIN = "https://witnessgrid.app"
BASE_URL = "https://witnessgrid-api.<account>.workers.dev"
OBJECT_STORE = "r2"
EMAIL_FROM = "WitnessGrid <noreply@witnessgrid.app>"
MAGIC_LINK_TTL_MINUTES = "15"
PLATFORM = "workers"
